name: Build and Release CloudStream Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      new_version: ${{ steps.check.outputs.new_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check if version is not released yet
        id: check
        shell: bash
        run: |
          new_version=$(sed -nE 's/^val versionName\s*=\s*"(.*)".*/\1/p' AnimeLib/build.gradle.kts)
          echo "Version: $new_version"

          if [ -z "$new_version" ]; then
            echo "versionName not found in AnimeLib/build.gradle.kts"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$new_version" > /dev/null; then
            echo "Tag v$new_version already exists"
            released=true
          else
            released=false
          fi

          if [ "$released" = "false" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$new_version" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson

      - name: Point plugins.json to release assets
        run: |
          base="https://github.com/${{ github.repository }}/releases/latest/download"
          jq --arg base "$base" 'map(.url = "\($base)/\(.internalName).cs3")' build/plugins.json > plugins.json
          cat plugins.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          name: "v${{ needs.check-version.outputs.new_version }}"
          body: "Release of version v${{ needs.check-version.outputs.new_version }} for ${{ github.repository }}."
          files: |
            AnimeLib/build/AnimeLib.cs3
            plugins.json
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
